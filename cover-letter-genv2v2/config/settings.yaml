# Copy to settings.yaml and fill in. Real file is git-ignored.
# Values here are also overridable via env vars (LLM_API_KEY, LLM_ENDPOINT, LLM_MODEL).
llm:
  api_key: "${LLM_API_KEY}"
  endpoint: "http://localhost:20128/v1/chat/completions"
  model: "openrouter/owl-alpha"
  headers:
    x-api-key: "sk-bfd1ecff86d98705-f14b03-2fdc2632"

  # Tuned per stage inside the pipeline; these are fallback defaults.
  timeout_seconds: 120
  max_retries: 3

pipeline:
  # If validator fails, how many times to ask Writer to rewrite with feedback.
  max_writer_retries: 2

  # Per-stage timeout (seconds) for each LLM call. MUST be >= llm.timeout_seconds,
  # else a stage is cut off mid-request (the TimeoutError you saw at 30s).
  stage_timeout: 180

  # Hard length bounds (words). Validator will reject outside this range.
  min_words: 70
  max_words: 110

  # Concurrency for batch generation.
  max_concurrent: 5

  # Analyzer.confidence < this → universal-mode letter (no aggressive
  # hook to the vacancy). Helps avoid forced fits.
  low_confidence_threshold: 0.5

  # Analyzer.confidence < this → skip generation entirely.
  skip_below_confidence: 0.2

# Optional. Smell-phrases that must NOT appear in the letter unless they're
# also present in the resume itself. Useful to block hallucinations like
# "финтех" / "сотни пользователей" when your resume doesn't actually mention
# them. Leave commented out to use the built-in defaults from src/facts.py.
# forbidden_claims:
#   - финтех
#   - банковские транзакции
#   - международные платежи
#   - сотни пользователей
#   - тысячи пользователей
#   - миллионы пользователей
#   - high-load
#   - production-нагрузка
